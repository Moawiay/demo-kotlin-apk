name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemoApp-v1.0.0-Debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Demo App v1.0.0"
          body: |
            ### 🎉 Demo Android APK (Kotlin)

            Compiled automatically via **GitHub Actions** and **Kotlin** without any manual file uploads!

            - **App Name:** Demo App
            - **Package:** `com.moawia.demoapp`
            - **Build Type:** Debug APK

            📲 **Download the `.apk` file below directly onto your Android device to install it!**
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
